name: Build

on: [push, workflow_dispatch]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up git repository
        uses: actions/checkout@v3

      - name: Build plugin
        uses: coq-community/docker-coq-action@v1
        with:
          custom_image: 'rocq/rocq-prover:dev-ocaml-4.14.2-flambda'
          opam_file: 'coq-waterproof.opam'
          before_install: |
            startGroup "Unpin dune (rocq mode needs dune >= 3.21)"
              opam update
              opam unpin dune -n || true
            endGroup
          before_script: |
            startGroup "Install dependencies"
              sudo apt-get -y -q install binutils make csh g++ sed gawk autoconf automake autotools-dev
            endGroup
